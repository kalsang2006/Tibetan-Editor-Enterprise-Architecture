[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "teea"
version = "1.0.0"
description = "Tibetan Editor Enterprise Architecture (TEEA) — core NLP platform. Tokenization module (TiBERT-backed)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "TEEA Contributors" }]
keywords = ["tibetan", "nlp", "tokenization", "tibert", "word"]

# Runtime dependencies for the tokenization module.
# NOTE: `torch` is intentionally NOT a dependency here. The TiBERT *tokenizer*
# (SentencePiece via HuggingFace) does not require a deep-learning backend.
# `torch` will be introduced by the future embeddings/inference module.
#
# Version policy: application code declares *compatible ranges*, not exact pins.
# Exact `==` pins in a distributable project's metadata cause unresolvable
# conflicts for any consumer and, in practice here, would force a downgrade of
# the toolchain already provisioned in the target environment. Reproducible
# deployments are pinned separately via a lock/constraints file, which is the
# correct layer for that concern.
dependencies = [
    "pydantic>=2.9.2,<3",
    "pydantic-settings>=2.6.1,<3",
    "structlog>=24.4.0,<27",
    "transformers>=4.46.3,<6",
    "sentencepiece>=0.2.0,<0.3",
]

[project.scripts]
teea = "teea.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<10",
    "pytest-cov>=6.0.0,<8",
    "mypy>=1.13.0,<2",
    "ruff>=0.8.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teea"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# The default run is hermetic: integration tests need the real TiBERT model and
# are opted into explicitly with `pytest -m integration`.
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require the real TiBERT model (network/model access).",
]

[tool.mypy]
python_version = "3.12"
# src-layout: without this, `mypy tests` cannot resolve the `teea` package and
# the test suite silently goes untyped-checked.
mypy_path = "src"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["transformers.*", "sentencepiece.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# BLE001/PLC0415 are enabled because the source already carries `noqa` directives
# justifying each blind-except and each intentional lazy import; enabling the
# rules makes those directives meaningful (and satisfies RUF100). Blind-except
# linting also directly supports the fault-isolation requirement in NFR 5.3.
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "BLE001", "PLC0415"]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "D105",   # magic methods (__repr__, __len__) are self-describing here
    "D107",   # Google convention: __init__ args are documented on the class
    "D301",   # backslashes in the PowerShell config examples are intentional
]

[tool.ruff.lint.per-file-ignores]
# RUF001: the normalization tests deliberately embed confusable/ambiguous
# characters (NO-BREAK SPACE, zero-width marks) because handling them is
# precisely what is under test.
"tests/**" = ["D", "RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["teea"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false