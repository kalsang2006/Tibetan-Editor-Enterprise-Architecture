<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TEEA</title>

    <style>
      html,
      body,
      #container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      * {
        box-sizing: border-box;
      }
    </style>

    <!--
      office.js is loaded from the local bundle, not from the Microsoft CDN.
      TEEA is offline-first (ADR-002) and must start on an air-gapped machine;
      a CDN script tag would make the task pane fail to load without a network.
    -->
    <script src="office.js"></script>
  </head>

  <body>
    <div id="container"></div>
  </body>
</html>
