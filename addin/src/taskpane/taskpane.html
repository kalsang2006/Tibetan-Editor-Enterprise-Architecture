<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TEEA</title>

    <style>
      html,
      body,
      #container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      * {
        box-sizing: border-box;
      }
    </style>

    <!--
      Office.js loading, in order of preference:

      1. Real Office.js from the Microsoft CDN. This is the only supported way
         to access the Word JavaScript APIs: inside Word this script connects
         to the host, and `Word.run` / `context.document.body` become real.
         Without it, `readDocumentText` has nothing to read and no suggestions
         are produced.

      2. If the CDN is unreachable (air-gapped / offline machine), the same
         official library is loaded from the vendored local copy
         (`office.full.js`), which webpack copies into `dist/`. Loading the
         real library from disk still lets the pane initialize against the
         Word host and read document text; it is NOT a stubbed API surface.
    -->
    <!-- Global process polyfill to prevent runtime ReferenceError in browser -->
    <script>
      window.process = window.process || { env: {} };
    </script>
    <script
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
      onerror="loadVendoredOfficeJs()"
    ></script>
    <script>
      function loadVendoredOfficeJs() {
        console.warn(
          '[TEEA] Office.js CDN unreachable - falling back to the vendored office.full.js.',
        );
        var fallback = document.createElement('script');
        fallback.src = 'office.full.js';
        document.head.appendChild(fallback);
      }
    </script>
  </head>

  <body>
    <div id="container"></div>
  </body>
</html>
